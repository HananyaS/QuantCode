name: Live Paper Trading (Kelly & Linear)

# Runs both strategies once per TRADING DAY on GitHub's hosted runners, so
# trading doesn't depend on a laptop being open. Decisions use the most
# recently completed daily bar (QQQ/QLD/TQQQ fetched fresh from Alpaca's
# data API every run, ^VIX from yfinance -- see live_run.py); orders are
# submitted during regular market hours so they fill immediately rather
# than queuing after-hours.
#
# "Once per trading day" is enforced by the Preflight step below, not by
# the trigger -- no scheduler can express it. Every step in this job,
# INCLUDING the notification, is gated on Preflight's decision, so a
# firing that has nothing to do does nothing and says nothing.
#
# TRIGGERS -- punctual primary outside GitHub, cron watchdog inside
# -----------------------------------------------------------------
# GitHub cron is best-effort, and measured over this repo's own first 33
# scheduled firings (2026-07-28 -> 08-19) it was late EVERY time: median
# 54min, p90 102min, worst 135min. A daily-bar strategy whose backtest
# earns close(t-1)->close(t) wants its fills at a consistent time; "some
# time between 11:03 and 13:00 ET, different every day" is tracking error
# nobody pays us for. So the punctual trigger lives OUTSIDE GitHub:
#
#   * PRIMARY -- an external scheduler (cron-job.org, 09:45 Mon-Fri,
#     timezone America/New_York) POSTs to this workflow's /dispatches
#     endpoint with {"ref":"main","inputs":{"source":"scheduler"}}. API
#     dispatches don't go through the cron batch queue, so they start in
#     seconds; and a timezone-aware scheduler removes the hour of DST
#     drift that GitHub's UTC-only cron cannot express.
#
#   * WATCHDOG -- the two crons below, unchanged. When the external
#     trigger did its job they find the session already complete and
#     stand down silently (~2s, no push). When it did NOT, they still
#     trade, and the notification is tagged "via cron fallback" -- so a
#     dead external trigger announces itself instead of quietly costing
#     trading days.
#
# Rollback is just disabling the external job: the crons on their own are
# exactly the old behaviour.
#
# State (data/live_state_kelly.db, data/live_state_linear.db) is normally
# gitignored -- runners are ephemeral, so this workflow force-commits those
# two files back to the repo after each run to persist the PDT round-trip
# guard and order ledger across runs. This is the only state that survives;
# everything else (market data, decisions) is recomputed fresh each time.
on:
  schedule:
    # Watchdog only -- the punctual primary is the external dispatch above.
    # Kept at the off-peak :45 minute (materially smaller queue delays than
    # :00) and spaced an hour apart so that if the external trigger is dead,
    # a badly-delayed firing still lands while the market is open and can
    # save the day. Both stand down silently when they aren't needed.
    # GitHub cron is UTC-only and doesn't shift with US DST, so these drift
    # an hour across the year -- fine for a watchdog, and exactly why the
    # punctual trigger is not one of these lines.
    - cron: "45 14 * * 1-5"
    - cron: "45 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- no orders submitted, no state written"
        type: boolean
        default: true
      source:
        # Who pressed the button. 'human' is a person at the Actions UI:
        # always execute, always report back, and honour dry_run. The
        # external scheduler passes 'scheduler', which must behave EXACTLY
        # like a cron firing instead -- guarded by Preflight, silent when
        # there is nothing to do -- otherwise it would bypass the
        # once-per-session rule and bring the duplicate pushes back.
        description: "Who triggered this run"
        type: choice
        options: [human, scheduler]
        default: human

permissions:
  contents: write

concurrency:
  group: live-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight -- should this firing trade, and should it speak?
        # Decides `trade` and `notify` for everything below. Cron fires
        # twice a weekday and knows nothing about the NYSE calendar, so
        # without this the job pushed a notification on every no-op firing:
        # two per normal trading day (the second meaningless), and two on
        # every market holiday (both meaningless). See
        # scripts/preflight_check.py for the full decision table.
        #
        # Silent no-op when: not an NYSE session, or today's session
        # already completed for BOTH strategies.
        # Runs + notifies when: first firing of an open session, or a
        # manual dispatch.
        # Skips but DOES notify when: the session never ran and the market
        # has already closed -- a missed day is worth hearing about.
        id: preflight
        env:
          ALPACA_API_KEY_KELLY: ${{ secrets.ALPACA_API_KEY_KELLY }}
          ALPACA_SECRET_KEY_KELLY: ${{ secrets.ALPACA_SECRET_KEY_KELLY }}
          # --manual is for a HUMAN at the button only. A scheduler-sourced
          # dispatch deliberately falls through to the guarded path, so the
          # once-per-session rule still holds and the watchdog crons behind
          # it still stand down silently.
          MANUAL_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'human') && '--manual' || '' }}
        run: python scripts/preflight_check.py $MANUAL_FLAG

      - name: Kelly strategy
        # dry_run is a HUMAN preview affordance and is deliberately ignored
        # for scheduler-sourced runs. It defaults to true, so keying the flag
        # on the input alone would let a scheduler payload that omitted
        # dry_run leave the bot previewing forever -- silently never trading,
        # while every run still reported success. A scheduler run always trades.
        id: kelly
        if: ${{ steps.preflight.outputs.trade == 'true' }}
        env:
          ALPACA_API_KEY_KELLY: ${{ secrets.ALPACA_API_KEY_KELLY }}
          ALPACA_SECRET_KEY_KELLY: ${{ secrets.ALPACA_SECRET_KEY_KELLY }}
          DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'human' && inputs.dry_run) && '--dry-run' || '' }}
        run: python scripts/live_run.py --strategy kelly $DRY_RUN_FLAG

      - name: Linear strategy
        # The two strategies are fully independent (separate accounts,
        # separate state) -- a Kelly failure must not block Linear's daily
        # run. !cancelled() still runs this after a Kelly step failure but
        # respects an actual workflow cancellation. The job still reports
        # failure overall if either step failed.
        id: linear
        if: ${{ !cancelled() && steps.preflight.outputs.trade == 'true' }}
        env:
          ALPACA_API_KEY_LINEAR: ${{ secrets.ALPACA_API_KEY_LINEAR }}
          ALPACA_SECRET_KEY_LINEAR: ${{ secrets.ALPACA_SECRET_KEY_LINEAR }}
          DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'human' && inputs.dry_run) && '--dry-run' || '' }}
        run: python scripts/live_run.py --strategy linear $DRY_RUN_FLAG

      - name: Regenerate dashboard
        # Rebuild the GitHub Pages report (docs/live-report/index.html)
        # from the updated ledgers. Skipped on dry runs -- the ledgers
        # didn't change, and regenerating would commit a timestamp-only
        # diff every preview.
        if: ${{ !cancelled() && steps.preflight.outputs.trade == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.source == 'human' && inputs.dry_run) }}
        run: python scripts/generate_live_report.py

      - name: Persist live state
        # always() so a partially-failed run still commits whatever the
        # ledger did record -- but only when we actually traded. A stood-
        # down firing has nothing to persist and skips the git work.
        if: ${{ always() && steps.preflight.outputs.trade == 'true' }}
        # The push can race anything that advanced origin/main since this
        # job's checkout (a code push during the run, a concurrent manual
        # run's state commit) -- a plain `git push` would fail and today's
        # order ledger would die with the ephemeral runner. Rebase onto the
        # updated remote and retry a few times; the state commit only
        # touches data/live_state_*.db, which nothing else writes, so the
        # rebase itself cannot conflict.
        run: |
          git config user.name "live-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/live_state_kelly.db data/live_state_linear.db 2>/dev/null || true
          git add docs/live-report/index.html 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist live trading state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $attempt) -- rebasing onto updated origin/main"
              git pull --rebase origin main
            done
            git push
          else
            echo "No state changes to persist (dry run, or no orders this run)."
          fi

      - name: Notify (ntfy.sh)
        # Push notification with the day's result -- success AND failure
        # (GitHub only emails on failure by default). The topic name is a
        # secret: ntfy.sh topics are open to anyone who knows the name, so
        # an unguessable name IS the access control. Subscribe to it in
        # the ntfy app / ntfy.sh web page to receive these.
        #
        # Gated on Preflight so this fires at most ONCE per trading day.
        # The `failure()` arm is the exception that must stay: if Preflight
        # itself blew up it never set an output, and a broken preflight is
        # exactly the thing you need to be told about.
        if: ${{ always() && (steps.preflight.outputs.notify == 'true' || failure()) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KELLY_OUTCOME: ${{ steps.kelly.outcome }}
          LINEAR_OUTCOME: ${{ steps.linear.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          PREFLIGHT_TRADED: ${{ steps.preflight.outputs.trade }}
          RUN_KIND: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'human' && inputs.dry_run) && 'dry run' || 'live run' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set -- skipping notification."
            exit 0
          fi
          # A run that TRADED but arrived via `schedule` means the punctual
          # external trigger never fired and a watchdog cron picked up the
          # slack. The day was saved, but the primary path is broken -- say
          # so, or a dead trigger looks exactly like a healthy day and we
          # quietly go back to random mid-morning fills.
          FALLBACK=""
          if [ "$TRIGGER" = "schedule" ] && [ "$PREFLIGHT_TRADED" = "true" ]; then
            FALLBACK=" (via cron fallback -- external trigger did not fire)"
          fi
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            # Reached via the failure() arm: preflight errored, or something
            # before it (checkout, pip install) did, so it never ran. Either
            # way today's session has not traded and nothing else will.
            TITLE="QuantCode $RUN_KIND FAILED to start (preflight=$PREFLIGHT_OUTCOME)"
            TAGS="rotating_light"
            PRIORITY="high"
            SUMMARY="The run failed before either strategy could execute, so today's session has NOT traded. Check the Actions logs."
          elif [ "$PREFLIGHT_TRADED" != "true" ]; then
            # Skipped on purpose, and the reason was judged worth telling
            # you about (today's only notifying skip: a missed session).
            TITLE="QuantCode $RUN_KIND SKIPPED"
            TAGS="warning"
            PRIORITY="high"
            SUMMARY="$PREFLIGHT_REASON"
          elif [ "$KELLY_OUTCOME" = "success" ] && [ "$LINEAR_OUTCOME" = "success" ]; then
            TITLE="QuantCode $RUN_KIND succeeded$FALLBACK"
            TAGS="white_check_mark,chart_with_upwards_trend"
            PRIORITY="default"
            SUMMARY=$(python scripts/generate_live_report.py --summary 2>/dev/null || echo "(summary unavailable)")
          else
            TITLE="QuantCode $RUN_KIND FAILED (kelly=$KELLY_OUTCOME linear=$LINEAR_OUTCOME)$FALLBACK"
            TAGS="rotating_light"
            PRIORITY="high"
            SUMMARY=$(python scripts/generate_live_report.py --summary 2>/dev/null || echo "(summary unavailable)")
          fi
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Title: $TITLE" \
              -H "Tags: $TAGS" \
              -H "Priority: $PRIORITY" \
              -H "Click: $RUN_URL" \
              -d "$SUMMARY" \
              "https://ntfy.sh/$NTFY_TOPIC" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Notification sent."
              exit 0
            fi
            echo "ntfy.sh returned HTTP $HTTP_CODE (attempt $attempt) -- retrying in 10s"
            sleep 10
          done
          echo "Notification failed after 3 attempts (last HTTP $HTTP_CODE)."
