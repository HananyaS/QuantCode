name: Live Paper Trading (Kelly & Linear)

# Runs both strategies once per weekday on GitHub's hosted runners, so
# trading doesn't depend on a laptop being open. Decisions use the most
# recently completed daily bar (QQQ/QLD/TQQQ fetched fresh from Alpaca's
# data API every run, ^VIX from yfinance -- see live_run.py); orders are
# submitted during regular market hours so they fill immediately rather
# than queuing after-hours.
#
# The schedule trigger below runs the REAL pipeline (submits real, though
# paper, orders) -- only a manual workflow_dispatch run respects the
# dry_run input. There is no dry-run gate on the schedule itself.
#
# State (data/live_state_kelly.db, data/live_state_linear.db) is normally
# gitignored -- runners are ephemeral, so this workflow force-commits those
# two files back to the repo after each run to persist the PDT round-trip
# guard and order ledger across runs. This is the only state that survives;
# everything else (market data, decisions) is recomputed fresh each time.
on:
  schedule:
    # 15:00 UTC = 10:00am ET (EST, winter) / 11:00am ET (EDT, summer) --
    # GitHub Actions cron is UTC-only and doesn't shift with US DST, so a
    # fixed time drifts by an hour across the year. Chosen so the WORST
    # case (EST) still gives a 30min buffer after the 9:30am open -- the
    # first 15-30min of a session tends to have the widest spreads/most
    # noise, so this avoids trading right at the open rather than just
    # barely after it.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only -- no orders submitted, no state written"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: live-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Kelly strategy
        env:
          ALPACA_API_KEY_KELLY: ${{ secrets.ALPACA_API_KEY_KELLY }}
          ALPACA_SECRET_KEY_KELLY: ${{ secrets.ALPACA_SECRET_KEY_KELLY }}
          DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        run: python scripts/live_run.py --strategy kelly $DRY_RUN_FLAG

      - name: Linear strategy
        # The two strategies are fully independent (separate accounts,
        # separate state) -- a Kelly failure must not block Linear's daily
        # run. !cancelled() still runs this after a Kelly step failure but
        # respects an actual workflow cancellation. The job still reports
        # failure overall if either step failed.
        if: ${{ !cancelled() }}
        env:
          ALPACA_API_KEY_LINEAR: ${{ secrets.ALPACA_API_KEY_LINEAR }}
          ALPACA_SECRET_KEY_LINEAR: ${{ secrets.ALPACA_SECRET_KEY_LINEAR }}
          DRY_RUN_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        run: python scripts/live_run.py --strategy linear $DRY_RUN_FLAG

      - name: Persist live state
        if: always()
        # The push can race anything that advanced origin/main since this
        # job's checkout (a code push during the run, a concurrent manual
        # run's state commit) -- a plain `git push` would fail and today's
        # order ledger would die with the ephemeral runner. Rebase onto the
        # updated remote and retry a few times; the state commit only
        # touches data/live_state_*.db, which nothing else writes, so the
        # rebase itself cannot conflict.
        run: |
          git config user.name "live-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/live_state_kelly.db data/live_state_linear.db 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist live trading state [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt $attempt) -- rebasing onto updated origin/main"
              git pull --rebase origin main
            done
            git push
          else
            echo "No state changes to persist (dry run, or no orders this run)."
          fi
